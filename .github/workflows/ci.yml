name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.11", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      # Replay module 1 from the committed data/raw snapshot so the worked-case tests
      # run against a real handoff rather than skipping. No network.
      - run: make module1-offline
      - run: pytest -q
      # Both worked cases and the paired comparison, fully offline and gated.
      - run: make module4-quick NSIM=200
      - run: make module4-cases NSIM=200
      - run: make compare
  module1-smoke:
    # Runs the real pipeline against live APIs (CT.gov, PubMed). Allowed to fail on network flakiness.
    # Module 4 runs in the same job because it consumes module 1's JSON handoff.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e .
      - run: make module1
      - run: make module4-quick
      - uses: actions/upload-artifact@v4
        with: { name: module1-outputs, path: outputs/module1 }
      - uses: actions/upload-artifact@v4
        with: { name: module4-outputs, path: outputs/module4 }
